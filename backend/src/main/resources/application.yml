# Every value that changes between your laptop and the server comes from an
# environment variable, with a safe default for local development.
spring:
  application:
    name: portfolio-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:portfolio}${DB_PARAMS:}
    username: ${DB_USER:portfolio}
    password: ${DB_PASSWORD:portfolio}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none        # Flyway owns the schema (db/migration)
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${PORT:8080}        # Render and Railway tell the app which port to use
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true       # /actuator/health/liveness and /readiness
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

portfolio:
  cors:
    # Comma-separated origins (scheme + host, no path), e.g. https://tu-usuario.github.io
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8000,http://127.0.0.1:8000,http://localhost:5500,http://127.0.0.1:5500}
  rate-limit:
    max-requests: 5          # per visitor, per window
    global-max-requests: 30  # everybody together, per window
    window: 1m
    trusted-proxy-hops: ${TRUSTED_PROXY_HOPS:1}
  notification:
    api-key: ${RESEND_API_KEY:}
    to: ${NOTIFY_TO_EMAIL:}
    from: ${NOTIFY_FROM:Portafolio <onboarding@resend.dev>}
