# Whole stack on your laptop with one command:  docker compose up --build
#   web  -> http://localhost:8000   (the portfolio, served by nginx)
#   api  -> http://localhost:8080   (Spring Boot; Swagger UI at /swagger-ui.html)
#   db   -> PostgreSQL 16 (data survives restarts in the "pgdata" volume)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    environment:
      DB_HOST: db
      DB_NAME: portfolio
      DB_USER: portfolio
      DB_PASSWORD: portfolio
      CORS_ALLOWED_ORIGINS: http://localhost:8000
      TRUSTED_PROXY_HOPS: "0"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  web:
    image: nginx:alpine
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./docker/config.local.js:/usr/share/nginx/html/js/config.js:ro
    ports:
      - "8000:80"
    depends_on:
      - api

volumes:
  pgdata:
